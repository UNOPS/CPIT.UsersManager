# Publishes CPIT.UsersManager to nuget.org when a version tag (e.g. v4.4.0) is pushed.
# Authenticates with nuget.org Trusted Publishing (OIDC), so no API key is stored in the repo.
name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write # required to request the OIDC token for nuget.org

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check tag matches PackageVersion
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          csproj_version=$(sed -n 's:.*<PackageVersion>\(.*\)</PackageVersion>.*:\1:p' UsersManager/UsersManager.csproj)
          if [ "$tag_version" != "$csproj_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match PackageVersion $csproj_version in UsersManager.csproj"
            exit 1
          fi

      - name: Pack
        run: dotnet pack UsersManager/UsersManager.csproj -c Release -o out

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
